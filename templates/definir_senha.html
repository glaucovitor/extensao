{% extends "base.html" %}
{% block titulo %}Definir senha{% endblock %}
{% block classe_main %}conteudo estreito{% endblock %}
{% block conteudo %}
<section class="cartao">
  <h1>Definir senha</h1>
  <p class="sub">Olá, <strong>{{ nome }}</strong>. Crie sua senha de acesso.</p>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nova senha
      <input name="senha" type="password" autocomplete="new-password" required autofocus>
    </label>
    <label>Confirme a senha
      <input name="confirmacao" type="password" autocomplete="new-password" required>
    </label>
    <button class="btn btn-primario" type="submit">Salvar senha</button>
  </form>
</section>
{% endblock %}
